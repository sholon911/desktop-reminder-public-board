[package]
name = "desktop-reminder-public-board-tauri"
version = "0.1.0"
description = "Windows local desktop todo, reminder and handover board."
authors = ["Desktop Reminder Public Board"]
edition = "2021"

[lib]
name = "desktop_reminder_public_board_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
sha2 = "0.10"
pbkdf2 = "0.12"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
